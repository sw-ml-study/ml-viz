[package]
name = "ml_viz_yew"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Michael A. Wright"]

[lib]
crate-type = ["cdylib"]

[dependencies]
ml_viz_scene = { path = "../scene" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.5"
web-sys = { version = "0.3", features = ["console"] }
