scene:
  title: "Minimal ML Landscape"
  environment: "salt_flat_mountains"
  frames: 120
objects:
  - type: "layer_stack"
    name: "encoder_stack"
    label: "Encoder stack"
    position: [-4.5, 0.0, 0.0]
    layers: 5
    svg: "assets/svg/callout_encoder.svg"
  - type: "network_graph"
    name: "attention_graph"
    label: "Attention heads"
    position: [-4.5, 2.2, 1.1]
    nodes: 16
  - type: "ml_cube"
    name: "decoder_cube"
    label: "Decoder"
    position: [0.0, -1.5, 0.6]
  - type: "rag_pipeline"
    name: "rag_module"
    label: "RAG retrieval island"
    position: [4.0, 0.5, 0.0]
# Interactive-only callouts read by the three.js/Yew client.
# Anchors are either { object: "<name>" } resolved to that object's position,
# or { world: [x, y, z] } in Blender Z-up. `offset` is added to the anchor.
callouts:
  - kind: tooltip
    anchor: { object: "encoder_stack" }
    title: "Encoder stack"
    text: "5 transformer blocks. Self-attention + feed-forward."
  - kind: tooltip
    anchor: { object: "attention_graph" }
    title: "Attention heads"
    text: "16 heads. Edges represent learned key-query affinities."
  - kind: tooltip
    anchor: { object: "decoder_cube" }
    title: "Decoder"
    text: "Autoregressive decoder. Outputs logits over the vocab."
  - kind: tooltip
    anchor: { object: "rag_module" }
    title: "Retrieval module"
    text: "Top-k document retrieval feeding into the decoder context."
  - kind: link
    anchor: { object: "decoder_cube" }
    offset: [0.0, 0.0, 1.4]
    text: "Decoder paper"
    url: "https://arxiv.org/abs/1706.03762"
  - kind: svg_billboard
    anchor: { object: "encoder_stack" }
    offset: [0.0, -1.8, 2.4]
    svg: "/assets/svg/callout_encoder.svg"
    width: 280
  - kind: html_panel
    anchor: { object: "rag_module" }
    offset: [0.0, 0.0, 2.2]
    title: "RAG pipeline"
    html: "<p>Documents are embedded and indexed offline.</p><p>At inference, the top-<b>k</b> matches are concatenated into the decoder prompt.</p>"
